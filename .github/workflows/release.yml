name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --scratch-path .build-release-arm64 --product mackit
          swift build -c release --arch arm64 --scratch-path .build-release-arm64 --product MacKitHost
          swift build -c release --arch x86_64 --scratch-path .build-release-x86_64 --product mackit
          swift build -c release --arch x86_64 --scratch-path .build-release-x86_64 --product MacKitHost
          arm_bin=$(swift build -c release --arch arm64 --scratch-path .build-release-arm64 --show-bin-path)
          x86_bin=$(swift build -c release --arch x86_64 --scratch-path .build-release-x86_64 --show-bin-path)
          mkdir -p release/MacKit.app/Contents/{MacOS,Helpers}
          lipo -create \
            "$arm_bin/mackit" \
            "$x86_bin/mackit" \
            -output release/mackit
          lipo -create \
            "$arm_bin/MacKitHost" \
            "$x86_bin/MacKitHost" \
            -output release/MacKit.app/Contents/MacOS/MacKitHost
          cp release/mackit release/MacKit.app/Contents/Helpers/mackit
          cp Resources/MacKitHost/Info.plist release/MacKit.app/Contents/Info.plist
          cp scripts/install-release.sh release/install.sh
          chmod +x release/mackit
          chmod +x release/install.sh
          codesign --force --sign - --options runtime \
            release/MacKit.app/Contents/Helpers/mackit
          codesign --force --sign - --options runtime \
            --entitlements Resources/MacKitHost/MacKitHost.entitlements \
            --requirements '=designated => identifier "dev.mackit.host"' \
            release/MacKit.app
          codesign --verify --deep --strict release/MacKit.app
          cd release
          tar czf mackit-macos-universal.tar.gz mackit MacKit.app install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/mackit-macos-universal.tar.gz
          generate_release_notes: true
